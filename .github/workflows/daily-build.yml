name: Daily Build

on:
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish as
        type: choice
        options:
          - nightly
          - stable
        default: nightly

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require custom for stable
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'stable'
        run: |
          if [ "${{ github.ref_name }}" != "custom" ]; then
            echo "Stable releases must be built from custom (got ${{ github.ref_name }})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read version
        id: meta
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate stable tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'stable'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          git fetch origin --tags
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Bump versionName in app/build.gradle.kts first."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success() && (github.event_name == 'schedule' || github.event.inputs.publish != 'stable')
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建（commit `${{ github.sha }}`）

            > ⚠️ 开发版本，可能不稳定，仅供测试。
          files: app/build/outputs/apk/release/*.apk

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        if: success() && github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'stable'
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ROCL ${{ steps.meta.outputs.version }}
          prerelease: false
          make_latest: true
          body: |
            ROCL ${{ steps.meta.outputs.version }} (`versionCode` ${{ steps.meta.outputs.code }})

            commit `${{ github.sha }}`
          files: app/build/outputs/apk/release/*.apk
